actor: InstallTester
modules:
    enabled:
        - Asserts:
        - WebDriver:
            url: "%ABSOLUTE_URL%"
            port: 9515
            window_size: 1920x1080 # 1080p resolution
            browser: chrome
            capabilities:
              chromeOptions:
                args:
                  - "--headless"
                  - "--disable-gpu"
        - \Helper\Install
